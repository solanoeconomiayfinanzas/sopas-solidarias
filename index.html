<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Campaña de Sopas Solidarias</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { brand: {
      50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',
      500:'#f97316',600:'#ea580c',700:'#c2410c',800:'#9a3412',900:'#7c2d12'
    }},
    fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
  }}
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body{ font-family:'Inter',system-ui,sans-serif; }
  .fade-in{ animation: fadeIn .22s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .missing{ color:#94a3b8; font-style:italic; font-size:.75rem; }
  .inline-edit{
    background:transparent; border:1.5px solid transparent; border-radius:7px;
    padding:3px 6px; width:100%; font:inherit; color:inherit;
    transition:all .12s; cursor:text;
  }
  .inline-edit:hover{ background:#f8fafc; border-color:#e2e8f0; }
  .inline-edit:focus{
    background:#fff; border-color:#fb923c;
    box-shadow:0 0 0 3px rgba(251,146,60,.15); outline:none;
  }
  .inline-edit::placeholder{ color:#cbd5e1; font-style:italic; font-weight:400; }
  .loading{ position:fixed; inset:0; background:rgba(255,255,255,.85); backdrop-filter:blur(4px); z-index:100; display:grid; place-items:center; }
  .spinner{ width:40px; height:40px; border:4px solid #e2e8f0; border-top-color:#f97316; border-radius:50%; animation: spin .8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

<div id="loading-screen" class="loading">
  <div class="text-center">
    <div class="spinner mx-auto"></div>
    <p class="text-sm text-slate-500 mt-3 font-medium">Cargando datos...</p>
  </div>
</div>

<!-- ═══════════ SELECCIÓN ═══════════ -->
<div id="screen-select" class="hidden min-h-screen items-center justify-center p-5" style="display:none">
  <div class="w-full max-w-2xl">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-brand-500 text-white grid place-items-center shadow-lg shadow-brand-500/30">
        <i data-lucide="soup" class="w-8 h-8"></i>
      </div>
      <h1 id="sel-title" class="mt-5 text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Campaña de Sopas Solidarias</h1>
      <p id="sel-sub" class="text-slate-500 mt-2">Acceso por enlace personal · Sin contraseñas</p>
    </div>
    <a href="?rol=admin"
       class="group block bg-slate-900 rounded-2xl shadow-sm hover:shadow-lg p-6 flex items-center gap-4 transition mb-4">
      <div class="w-12 h-12 rounded-xl bg-white/10 text-white grid place-items-center">
        <i data-lucide="shield-check" class="w-6 h-6"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="font-bold text-white text-lg leading-tight">Acceso Superadmin</p>
        <p class="text-xs text-slate-400 mt-0.5">Configura correos, campaña y respaldo</p>
      </div>
      <i data-lucide="arrow-right" class="w-5 h-5 text-slate-600 group-hover:text-white group-hover:translate-x-1 transition"></i>
    </a>
    <div id="sel-links" class="space-y-2"></div>
    <p class="text-center text-xs text-slate-400 mt-8">
      Los colaboradores, tesorero y despachadores acceden con el enlace único que el superadmin les comparte.
    </p>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="screen-app" class="hidden">
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 shrink-0 rounded-xl bg-brand-500 text-white grid place-items-center shadow-sm shadow-brand-500/40">
          <i data-lucide="soup" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0">
          <h1 id="hdr-title" class="font-bold text-slate-900 leading-tight truncate">Campaña de Sopas</h1>
          <p id="hdr-sub" class="text-xs text-slate-500 truncate">—</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-refresh" title="Actualizar datos" class="w-9 h-9 grid place-items-center rounded-lg text-slate-500 hover:bg-slate-100 transition">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
        <span id="role-badge" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full"></span>
        <button id="btn-new" class="hidden inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 active:scale-95 text-white text-sm font-semibold px-3.5 py-2 rounded-xl shadow-sm transition">
          <i data-lucide="plus" class="w-4 h-4"></i><span class="hidden sm:inline">Nueva venta</span>
        </button>
      </div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-5">
    <section id="progress-card" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 fade-in"></section>
    <section id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4"></section>
    <nav id="tabs" class="flex gap-1 p-1 bg-white rounded-xl border border-slate-200 shadow-sm w-fit max-w-full overflow-x-auto"></nav>
    <section id="panel" class="fade-in"></section>
    <footer class="pt-4 pb-8 text-center text-xs text-slate-400">
      <p id="foot-text">Campaña solidaria</p>
    </footer>
  </main>
</div>

<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm p-4 overflow-y-auto">
  <div id="modal-box" class="min-h-full flex items-start sm:items-center justify-center py-6"></div>
</div>
<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[60]"></div>

<script>
/* ═══════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════ */
const API = '/api/ventas';
const CONFIG_KEY = 'sopa_config_v3';

/* ═══════════════════════════════════════════════════════
   UTILIDADES
   ═══════════════════════════════════════════════════════ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const icons = () => { if (window.lucide) window.lucide.createIcons(); };
const IN = 'w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-brand-400 focus:ring-2 focus:ring-brand-100 outline-none bg-white';
const LBL = 'block text-xs font-bold text-slate-500 mb-1.5';
const val = (v, fb = '—') => v && String(v).trim() ? esc(v) : `<span class="missing">${fb}</span>`;

function inlineCell(id, field, value, opts = {}) {
  const { type='text', extra='', ph='', min='', max='', step='' } = opts;
  return `<input data-inline data-id="${id}" data-field="${field}" type="${type}"
    value="${esc(value ?? '')}" placeholder="${esc(ph)}"
    ${min!=='' ? `min="${min}"` : ''} ${max!=='' ? `max="${max}"` : ''} ${step!=='' ? `step="${step}"` : ''}
    class="inline-edit ${extra}">`;
}

function toast(msg, type='ok') {
  const cfg = { ok:{bg:'bg-slate-900', i:'check-circle', c:'text-emerald-400'},
                error:{bg:'bg-rose-600', i:'alert-circle', c:'text-white'},
                info:{bg:'bg-slate-900', i:'info', c:'text-brand-400'} }[type];
  const t = $('#toast');
  t.innerHTML = `<div class="${cfg.bg} text-white text-sm font-medium px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 fade-in">
    <i data-lucide="${cfg.i}" class="w-4 h-4 ${cfg.c}"></i><span>${esc(msg)}</span></div>`;
  t.classList.remove('hidden'); icons();
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.add('hidden'), 2800);
}

/* ═══════════════════════════════════════════════════════
   DATOS · config local + ventas desde API
   ═══════════════════════════════════════════════════════ */
const defaultConfig = { titulo:'Sopas Solidarias', beneficiario:'Ayuda para un enfermo', meta:120, precio:5, moneda:'$' };
const defaultEquipo = { colaboradores: [], tesoreroEmail: '', despachadores: [] };

let data = {
  config: { ...defaultConfig },
  colaboradores: [],
  tesoreroEmail: '',
  despachadores: [],
  ventas: []
};

function cargarConfigLocal() {
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    data.config = { ...defaultConfig, ...(p.config || {}) };
    data.colaboradores = Array.isArray(p.colaboradores) ? p.colaboradores : [];
    data.tesoreroEmail = typeof p.tesoreroEmail === 'string' ? p.tesoreroEmail : '';
    data.despachadores = Array.isArray(p.despachadores) ? p.despachadores : [];
  } catch {}
}
function guardarConfigLocal() {
  try {
    localStorage.setItem(CONFIG_KEY, JSON.stringify({
      config: data.config,
      colaboradores: data.colaboradores,
      tesoreroEmail: data.tesoreroEmail,
      despachadores: data.despachadores
    }));
  } catch {}
}

async function cargarVentasDesdeAPI() {
  try {
    const res = await fetch(API, { cache: 'no-store' });
    if (!res.ok) throw new Error('Error ' + res.status);
    const ventas = await res.json();
    data.ventas = ventas.map(v => ({
      ...v,
      cantidad: Number(v.cantidad) || 0,
      montoPagado: Number(v.montoPagado) || 0,
      conciliado: !!v.conciliado,
      entregado: !!v.entregado
    }));
  } catch (e) {
    toast('No se pudo cargar desde el servidor', 'error');
    console.error(e);
  }
}

/* Guarda una venta en el servidor. Si venta==null, no hace nada remoto. */
async function guardarVenta(venta) {
  if (!venta) return;
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(venta)
    });
    if (!res.ok) throw new Error('Error ' + res.status);
  } catch (e) {
    toast('Error al guardar en servidor: ' + e.message, 'error');
    console.error(e);
  }
}
async function borrarVentaAPI(id) {
  try {
    await fetch(API + '/' + id, { method: 'DELETE' });
  } catch (e) {
    toast('Error al eliminar en servidor', 'error');
  }
}

/* Derivados */
const precio = () => Number(data.config.precio) || 0;
const money = n => `${data.config.moneda}${Number(n).toLocaleString('es-CO',{minimumFractionDigits:0,maximumFractionDigits:2})}`;
const fmt = iso => new Date(iso).toLocaleString('es-CO', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
const ventasOrd = () => [...data.ventas].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
const totalSopas = () => data.ventas.reduce((s,v) => s + Number(v.cantidad||0), 0);
const totalRecaudado = () => data.ventas.reduce((s,v) => s + Number(v.montoPagado||0), 0);
const totalConciliado = () => data.ventas.filter(v => v.conciliado).reduce((s,v) => s + Number(v.montoPagado||0), 0);
const totalEntregado = () => data.ventas.filter(v => v.entregado).reduce((s,v) => s + Number(v.cantidad||0), 0);
const estaIncompleta = v => !v.cliente || !v.telefono || !v.ubicacion || !v.referencia || !v.montoPagado;
const badgeIncompleta = v => estaIncompleta(v) ? `
  <span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-200">
    <i data-lucide="alert-triangle" class="w-3 h-3"></i> Incompleta
  </span>` : '';

/* ═══════════════════════════════════════════════════════
   ACCESO POR URL
   ═══════════════════════════════════════════════════════ */
const qs = new URLSearchParams(location.search);
const rolParam = (qs.get('rol') || '').toLowerCase();
const emailParam = (qs.get('email') || '').trim().toLowerCase();

let user = null;
function determinarUsuario() {
  user = null;
  if (rolParam === 'admin') {
    user = { rol:'admin', nombre:'Superadmin', email:'' };
  } else if (rolParam === 'colaborador' && emailParam) {
    const c = data.colaboradores.find(x => x.email.toLowerCase() === emailParam);
    if (c) user = { rol:'colaborador', nombre:c.nombre, email:c.email };
  } else if (rolParam === 'tesorero' && emailParam) {
    if (data.tesoreroEmail && data.tesoreroEmail.toLowerCase() === emailParam)
      user = { rol:'tesorero', nombre:'Tesorero', email:data.tesoreroEmail };
  } else if (rolParam === 'despachador' && emailParam) {
    const d = data.despachadores.find(x => x.email.toLowerCase() === emailParam);
    if (d) user = { rol:'despachador', nombre:d.nombre, email:d.email };
  }
}

let activeTab = null;
const filtros = { search:'', conciliado:'', entregado:'', colaborador:'', incompletos:false };

/* ═══════════════════════════════════════════════════════
   PANTALLA DE SELECCIÓN
   ═══════════════════════════════════════════════════════ */
function renderSelect() {
  $('#sel-title').textContent = data.config.titulo;
  $('#sel-sub').textContent = `${data.config.meta} sopas · ${money(precio())} c/u · ${data.config.beneficiario}`;

  const base = location.origin === 'null' ? location.href.split('?')[0] : location.origin + location.pathname;
  const rows = [];

  data.colaboradores.forEach(c => rows.push({
    href: `${base}?rol=colaborador&email=${encodeURIComponent(c.email)}`,
    icon:'user-pen', color:'bg-brand-50 text-brand-600',
    title: c.nombre, sub:'Colaborador · ' + c.email
  }));
  if (data.tesoreroEmail) rows.push({
    href: `${base}?rol=tesorero&email=${encodeURIComponent(data.tesoreroEmail)}`,
    icon:'banknote', color:'bg-emerald-50 text-emerald-600',
    title:'Tesorería', sub:'Conciliación · ' + data.tesoreroEmail
  });
  data.despachadores.forEach(d => rows.push({
    href: `${base}?rol=despachador&email=${encodeURIComponent(d.email)}`,
    icon:'truck', color:'bg-sky-50 text-sky-600',
    title: d.nombre, sub:'Despachador · ' + d.email
  }));

  $('#sel-links').innerHTML = rows.length
    ? `<p class="text-xs font-bold uppercase tracking-wider text-slate-400 mt-6 mb-2 px-1">Accesos configurados</p>` +
      rows.map(r => `
      <a href="${r.href}" class="group flex items-center gap-3 bg-white rounded-xl border border-slate-200 hover:border-brand-300 hover:shadow-sm p-3 transition">
        <div class="w-9 h-9 rounded-lg ${r.color} grid place-items-center shrink-0">
          <i data-lucide="${r.icon}" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0 flex-1">
          <p class="font-semibold text-sm text-slate-800 truncate">${esc(r.title)}</p>
          <p class="text-xs text-slate-500 truncate">${esc(r.sub)}</p>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:text-brand-500"></i>
      </a>`).join('')
    : `<div class="mt-4 bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-2xl p-4 text-center">
        Aún no hay accesos configurados. Entra como Superadmin para agregar correos.
      </div>`;
  icons();
}

/* ═══════════════════════════════════════════════════════
   RENDER PRINCIPAL
   ═══════════════════════════════════════════════════════ */
const TABS = {
  admin: [
    {id:'ventas', label:'Ventas', icon:'receipt'},
    {id:'equipo', label:'Equipo', icon:'users'},
    {id:'campaña', label:'Campaña', icon:'settings'},
    {id:'respaldo', label:'Respaldo', icon:'database'}
  ],
  colaborador: [{id:'mis-ventas', label:'Mis ventas', icon:'receipt'}],
  tesorero:    [{id:'conciliacion', label:'Conciliación', icon:'banknote'}],
  despachador: [{id:'entregas', label:'Entregas', icon:'truck'}]
};

function render() {
  if (!user) return;
  if (!activeTab || !TABS[user.rol].some(t => t.id === activeTab)) {
    activeTab = TABS[user.rol][0].id;
  }
  renderHeader(); renderProgress(); renderStats(); renderTabs(); renderPanel(); icons();
}

function renderHeader() {
  $('#hdr-title').textContent = data.config.titulo;
  $('#hdr-sub').textContent = `${data.config.beneficiario} · ${money(precio())} por sopa`;
  $('#foot-text').textContent = `${data.config.titulo} · ${data.config.beneficiario}`;

  const b = $('#role-badge');
  const map = {
    admin:       { txt:'Superadmin', cls:'bg-slate-900 text-white', i:'shield-check' },
    colaborador: { txt:user.nombre,  cls:'bg-brand-50 text-brand-700 border border-brand-200', i:'user-pen' },
    tesorero:    { txt:'Tesorería',  cls:'bg-emerald-50 text-emerald-700 border border-emerald-200', i:'banknote' },
    despachador: { txt:user.nombre,  cls:'bg-sky-50 text-sky-700 border border-sky-200', i:'truck' }
  }[user.rol];
  b.className = `hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full ${map.cls}`;
  b.innerHTML = `<i data-lucide="${map.i}" class="w-3.5 h-3.5"></i> ${esc(map.txt)}`;
  $('#btn-new').classList.toggle('hidden', user.rol !== 'colaborador');
}

function renderProgress() {
  const meta = Number(data.config.meta) || 0;
  const vendidas = totalSopas();
  const pct = meta > 0 ? Math.min(100, Math.round((vendidas/meta)*100)) : 0;
  const libres = Math.max(0, meta - vendidas);
  $('#progress-card').innerHTML = `
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Progreso de la campaña</p>
        <p class="mt-1 text-2xl font-extrabold text-slate-900">
          <span>${vendidas}</span><span class="text-slate-300 mx-1">/</span><span>${meta}</span>
          <span class="text-base font-semibold text-slate-500 ml-1">sopas</span>
        </p>
      </div>
      <div class="text-right">
        <p class="text-3xl font-extrabold text-brand-600 leading-none">${pct}%</p>
        <p class="text-xs text-slate-500 mt-1">${libres === 0 ? '¡Meta completada!' : libres + ' disponibles'}</p>
      </div>
    </div>
    <div class="mt-4 h-3 w-full bg-slate-100 rounded-full overflow-hidden">
      <div class="h-full rounded-full bg-gradient-to-r from-brand-400 to-brand-600 transition-all duration-500" style="width:${pct}%"></div>
    </div>`;
}

function renderStats() {
  let cards;
  const meta = Number(data.config.meta) || 0;
  if (user.rol === 'admin' || user.rol === 'tesorero') {
    cards = [
      { label:'Recaudado',   value:money(totalRecaudado()),  icon:'wallet',       color:'text-emerald-600', bg:'bg-emerald-50' },
      { label:'Conciliado',  value:money(totalConciliado()), icon:'badge-check',  color:'text-sky-600',    bg:'bg-sky-50' },
      { label:'Entregadas',  value:totalEntregado(),         icon:'truck',        color:'text-brand-600',  bg:'bg-brand-50' },
      { label:'Pendientes',  value:money(totalRecaudado()-totalConciliado()), icon:'clock', color:'text-amber-600', bg:'bg-amber-50' }
    ];
  } else if (user.rol === 'colaborador') {
    const mias = data.ventas.filter(v => v.colaboradorEmail === user.email);
    const sopas = mias.reduce((s,v) => s + Number(v.cantidad||0), 0);
    const rec = mias.reduce((s,v) => s + Number(v.montoPagado||0), 0);
    cards = [
      { label:'Mis ventas',  value:mias.length,          icon:'receipt',      color:'text-brand-600',  bg:'bg-brand-50' },
      { label:'Sopas',       value:sopas,                icon:'soup',         color:'text-sky-600',    bg:'bg-sky-50' },
      { label:'Recaudado',   value:money(rec),           icon:'wallet',       color:'text-emerald-600', bg:'bg-emerald-50' },
      { label:'Disponibles', value:Math.max(0, meta-sopas), icon:'package',   color:'text-amber-600',  bg:'bg-amber-50' }
    ];
  } else {
    const listas = data.ventas.filter(v => v.conciliado && !v.entregado);
    const ent = data.ventas.filter(v => v.entregado);
    cards = [
      { label:'Por entregar', value:listas.length,           icon:'package',      color:'text-sky-600',    bg:'bg-sky-50' },
      { label:'Sopas por entregar', value:listas.reduce((s,v)=>s+Number(v.cantidad||0),0), icon:'soup', color:'text-brand-600', bg:'bg-brand-50' },
      { label:'Entregadas hoy', value:ent.filter(v => esHoy(v.entregadoFecha)).length, icon:'check-circle-2', color:'text-emerald-600', bg:'bg-emerald-50' },
      { label:'Total entregadas', value:ent.length,          icon:'truck',        color:'text-slate-600',  bg:'bg-slate-100' }
    ];
  }
  $('#stats').innerHTML = cards.map(c => `
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
      <div class="w-9 h-9 rounded-lg ${c.bg} ${c.color} grid place-items-center mb-3">
        <i data-lucide="${c.icon}" style="width:18px;height:18px"></i>
      </div>
      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">${c.label}</p>
      <p class="text-xl font-extrabold text-slate-900 mt-0.5 truncate">${c.value}</p>
    </div>`).join('');
}
function esHoy(iso) {
  if (!iso) return false;
  const d = new Date(iso), n = new Date();
  return d.toDateString() === n.toDateString();
}

function renderTabs() {
  $('#tabs').innerHTML = TABS[user.rol].map(t => `
    <button data-tab="${t.id}"
      class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition
      ${activeTab === t.id ? 'bg-brand-500 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-100'}">
      <i data-lucide="${t.icon}" class="w-4 h-4"></i>${t.label}
    </button>`).join('');
}

function renderPanel() {
  const p = $('#panel');
  if (user.rol === 'admin') {
    if (activeTab === 'ventas') p.innerHTML = panelAdminVentas();
    else if (activeTab === 'equipo') p.innerHTML = panelEquipo();
    else if (activeTab === 'campaña') p.innerHTML = panelCampaña();
    else if (activeTab === 'respaldo') p.innerHTML = panelRespaldo();
  } else if (user.rol === 'colaborador') p.innerHTML = panelColaborador();
  else if (user.rol === 'tesorero')     p.innerHTML = panelTesorero();
  else if (user.rol === 'despachador')  p.innerHTML = panelDespachador();
  icons();
}

function panelAdminVentas() {
  let list = ventasOrd();
  if (filtros.search) {
    const q = filtros.search.toLowerCase();
    list = list.filter(v =>
      (v.cliente||'').toLowerCase().includes(q) ||
      (v.telefono||'').toLowerCase().includes(q) ||
      (v.ubicacion||'').toLowerCase().includes(q) ||
      (v.referencia||'').toLowerCase().includes(q));
  }
  if (filtros.conciliado === 'si') list = list.filter(v => v.conciliado);
  if (filtros.conciliado === 'no') list = list.filter(v => !v.conciliado);
  if (filtros.entregado === 'si')  list = list.filter(v => v.entregado);
  if (filtros.entregado === 'no')  list = list.filter(v => !v.entregado);
  if (filtros.colaborador)         list = list.filter(v => v.colaboradorEmail === filtros.colaborador);
  if (filtros.incompletos)         list = list.filter(estaIncompleta);

  const optCol = ['<option value="">Todos los colaboradores</option>']
    .concat(data.colaboradores.map(c => `<option value="${esc(c.email)}" ${filtros.colaborador===c.email?'selected':''}>${esc(c.nombre)}</option>`))
    .join('');
  const totalIncompletas = data.ventas.filter(estaIncompleta).length;

  return `
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex flex-wrap gap-3">

        </div>
        <select id="f-conc" class="${IN} w-auto">
          <option value="">Conciliación: todas</option>
          <option value="si" ${filtros.conciliado==='si'?'selected':''}>Solo conciliadas</option>
          <option value="no" ${filtros.conciliado==='no'?'selected':''}>Sin conciliar</option>
        </select>
        <select id="f-ent" class="${IN} w-auto">
          <option value="">Entrega: todas</option>
          <option value="si" ${filtros.entregado==='si'?'selected':''}>Entregadas</option>
          <option value="no" ${filtros.entregado==='no'?'selected':''}>No entregadas</option>
        </select>
        <select id="f-col" class="${IN} w-auto">${optCol}</select>
        <button id="f-incomp" class="inline-flex items-center gap-1.5 px-3 py-2 text-sm font-semibold rounded-xl border transition
          ${filtros.incompletos ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">
          <i data-lucide="alert-triangle" class="w-4 h-4"></i> Incompletas ${totalIncompletas ? `<span class="bg-amber-500 text-white text-[10px] px-1.5 rounded-full">${totalIncompletas}</span>` : ''}
        </button>
      </div>
      ${hintBanner}
      <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 text-xs text-slate-500">
        <b class="text-slate-800">${list.length}</b> registro(s) ·
        <b class="text-slate-800">${list.reduce((s,v)=>s+Number(v.cantidad||0),0)}</b> sopa(s) ·
        Total <b class="text-slate-800">${money(list.reduce((s,v)=>s+Number(v.montoPagado||0),0))}</b>
      </div>
      ${list.length === 0 ? vacio('Sin ventas', 'Ajusta filtros o espera registros de colaboradores.') : `

        <table class="w-full text-sm">
          <thead>

              <th class="px-3 py-3 font-bold">Ubicación</th>

          <div><label class="${LBL}">Monto pagado</label>
            <input name="montoPagado" type="number" min="0" step="0.01" placeholder="Opcional" class="${IN}"></div>
          <div class="sm:col-span-2"><label class="${LBL}">Nota</label>

      entregado: false, entregadoPor: '', entregadoFecha: ''

    // Guardar en servidor

    // Refrescar desde servidor
    await cargarVentasDesdeAPI();
    cerrar();
    render();
    toast(`Venta registrada · ${cantidad} sopa(s)`);
  });
}

/* ═══════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════ */
function vacio(titulo, sub) {
  return `<div class="py-16 text-center">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-100 text-slate-400 grid place-items-center mb-3">
      <i data-lucide="inbox" class="w-6 h-6"></i>
    </div>
    <p class="font-semibold text-slate-700">${titulo}</p>
    <p class="text-sm text-slate-400 mt-1">${sub}</p>
  </div>`;
}

function descargar(nombre, contenido, tipo) {
  const blob = new Blob([contenido], {type: tipo});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function fechaArchivo() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
function exportarCSV() {
  const head = ['Fecha','Colaborador','Cliente','Telefono','Ubicacion','Piso','Departamento',
                'Cantidad','PrecioUnit','MontoPagado','Metodo','Referencia',
                'Conciliado','NotaConciliacion','Entregado','FechaConciliacion','FechaEntrega'];
  const rows = ventasOrd().map(v => [
    new Date(v.fecha).toLocaleString('es-CO'),
    v.colaborador||'', v.cliente||'', v.telefono||'', v.ubicacion||'', v.piso||'', v.departamento||'',
    v.cantidad||0, precio(), v.montoPagado||0, v.metodo||'', v.referencia||'',
    v.conciliado ? 'SI' : 'NO', v.notaConciliacion || '',
    v.entregado ? 'SI' : 'NO',
    v.conciliadoFecha ? new Date(v.conciliadoFecha).toLocaleString('es-CO') : '',
    v.entregadoFecha ? new Date(v.entregadoFecha).toLocaleString('es-CO') : ''
  ]);
  const csv = [head, ...rows].map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  descargar(`sopas_ventas_${fechaArchivo()}.csv`, '\uFEFF' + csv, 'text/csv;charset=utf-8');
  toast('Excel (CSV) descargado');
}

/* ═══════════════════════════════════════════════════════
   ⭐ EDICIÓN EN LÍNEA → GUARDA EN API
   ═══════════════════════════════════════════════════════ */
$('#panel').addEventListener('change', async e => {
  const inp = e.target.closest('[data-inline]');
  if (!inp) return;
  const id = inp.dataset.id, field = inp.dataset.field;
  const v = data.ventas.find(x => x.id === id);
  if (!v) return;

  if (user.rol === 'colaborador' && v.colaboradorEmail !== user.email) {
    toast('No puedes editar ventas de otro colaborador', 'error');
    inp.value = v[field] || '';
    return;
  }

  let value = inp.value;
  if (field === 'cantidad') {
    value = Number(value);
    if (!Number.isFinite(value) || value < 1) {
      toast('Cantidad inválida', 'error');
      inp.value = v.cantidad;
      return;
    }
    const otras = totalSopas() - Number(v.cantidad || 0);
    const disp = Number(data.config.meta) - otras;
    if (value > disp) {
      toast(`Solo quedan ${disp} sopa(s) disponibles`, 'error');
      inp.value = v.cantidad;
      return;
    }
  } else if (field === 'montoPagado') {
    if (String(value).trim() === '') {
      value = 0;
      inp.value = '';
    } else {
      value = Number(value);
      if (!Number.isFinite(value) || value < 0) {
        toast('Monto inválido', 'error');
        inp.value = v.montoPagado || '';
        return;
      }
    }
  } else {
    value = String(value || '').trim();
  }

  if (v[field] === value) return;
  v[field] = value;
  await guardarVenta(v);

  const row = document.querySelector(`tr[data-row="${id}"]`);
  if (row) {
    const badge = row.querySelector('[data-badge]');
    if (badge) badge.innerHTML = badgeIncompleta(v);
  }
  renderProgress(); renderStats(); icons();

  inp.style.transition = 'background .5s';
  inp.style.background = '#dcfce7';
  setTimeout(() => { inp.style.background = ''; }, 600);
});

$('#panel').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-inline]')) {
    e.preventDefault();
    e.target.blur();
  }
});

/* ═══════════════════════════════════════════════════════
   OTROS EVENTOS
   ═══════════════════════════════════════════════════════ */
$('#panel').addEventListener('click', async e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { activeTab = tb.dataset.tab; render(); return; }
  if (e.target.closest('#btn-new-inline')) { openModal(); return; }

  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const link = cp.dataset.copy;
    navigator.clipboard?.writeText(link).then(() => toast('Enlace copiado')).catch(() => prompt('Copia el enlace:', link));
    return;
  }

  const rm = e.target.closest('[data-remove]');
  if (rm) {
    const tipo = rm.dataset.remove, email = rm.dataset.email;
    if (!confirm(`¿Eliminar este ${tipo}?`)) return;
    if (tipo === 'colaborador') data.colaboradores = data.colaboradores.filter(c => c.email !== email);
    if (tipo === 'despachador') data.despachadores = data.despachadores.filter(d => d.email !== email);
    guardarConfigLocal();
    render(); renderSelect(); toast('Eliminado');
    return;
  }

  const act = e.target.closest('[data-action]');
  if (act) {
    const id = act.dataset.id, venta = data.ventas.find(v => v.id === id);
    if (!venta) return;
    if (act.dataset.action === 'del') {
      if (user.rol === 'colaborador' && venta.colaboradorEmail !== user.email)
        return toast('No puedes eliminar ventas de otro colaborador', 'error');
      if (!confirm(`¿Eliminar la venta de "${venta.cliente || 'Sin nombre'}"?`)) return;
      await borrarVentaAPI(id);
      data.ventas = data.ventas.filter(v => v.id !== id);
      render();
      toast('Venta eliminada');
    }
    return;
  }

  const ent = e.target.closest('[data-ent]');
  if (ent) {
    const v = data.ventas.find(x => x.id === ent.dataset.ent);
    if (!v) return;
    v.entregado = true;
    v.entregadoPor = user.nombre;
    v.entregadoFecha = new Date().toISOString();
    await guardarVenta(v);
    render();
    toast('Entrega registrada');
    return;
  }

  if (e.target.closest('#f-incomp')) {
    filtros.incompletos = !filtros.incompletos;
    renderPanel();
    return;
  }

  if (e.target.closest('#btn-xls') || e.target.closest('#btn-xls-tes')) exportarCSV();
  if (e.target.closest('#btn-json')) {
    descargar(`sopas_respaldo_${fechaArchivo()}.json`, JSON.stringify(data, null, 2), 'application/json');
    toast('Respaldo JSON descargado');
  }
  if (e.target.closest('#btn-clear-sales')) {
    if (!data.ventas.length) return toast('No hay ventas', 'info');
    if (!confirm(`¿Borrar TODAS las ${data.ventas.length} ventas del servidor? Irreversible.`)) return;
    for (const v of [...data.ventas]) {
      await borrarVentaAPI(v.id);
    }
    data.ventas = [];
    render();
    toast('Todas las ventas fueron eliminadas');
  }
});

/* Conciliación (checkbox) */
$('#panel').addEventListener('change', async e => {
  const chk = e.target.closest('[data-conc]');
  if (chk) {
    const v = data.ventas.find(x => x.id === chk.dataset.conc);
    if (!v) return;
    v.conciliado = chk.checked;
    v.conciliadoPor = chk.checked ? user.nombre : '';
    v.conciliadoFecha = chk.checked ? new Date().toISOString() : '';
    await guardarVenta(v);
    render();
    toast(chk.checked ? 'Marcada como conciliada' : 'Conciliación retirada', 'info');
  }
});

/* Notas de conciliación */
let notaTimer;
$('#panel').addEventListener('input', e => {
  const n = e.target.closest('[data-nota]');
  if (n) {
    clearTimeout(notaTimer);
    notaTimer = setTimeout(async () => {
      const v = data.ventas.find(x => x.id === n.dataset.nota);
      if (v) {
        v.notaConciliacion = n.value;
        await guardarVenta(v);
      }
    }, 800);
  }
  if (e.target.id === 'f-search') {
    clearTimeout(window.__searchTimer);
    window.__searchTimer = setTimeout(() => {
      filtros.search = e.target.value;
      renderPanel();
      document.getElementById('f-search')?.focus();
    }, 250);
  }
});

$('#panel').addEventListener('change', e => {
  if (e.target.id === 'f-conc') { filtros.conciliado = e.target.value; renderPanel(); }
  if (e.target.id === 'f-ent')  { filtros.entregado = e.target.value; renderPanel(); }
  if (e.target.id === 'f-col')  { filtros.colaborador = e.target.value; renderPanel(); }
});

/* Formularios equipo / config */
$('#panel').addEventListener('submit', e => {
  const addForm = e.target.closest('[data-add]');
  if (addForm) {
    e.preventDefault();
    const tipo = addForm.dataset.add;
    const f = new FormData(addForm);
    if (tipo === 'colaborador' || tipo === 'despachador') {
      const nombre = String(f.get('nombre')||'').trim();
      const email = String(f.get('email')||'').trim().toLowerCase();
      if (!nombre || !email) return toast('Completa nombre y correo', 'error');
      const lista = tipo === 'colaborador' ? data.colaboradores : data.despachadores;
      if (lista.some(x => x.email.toLowerCase() === email)) return toast('Ese correo ya existe', 'error');
      lista.push({ nombre, email });
      guardarConfigLocal();
      render(); renderSelect();
      toast('Agregado');
    }
    if (tipo === 'tesorero') {
      const email = String(f.get('email')||'').trim().toLowerCase();
      if (!email) return toast('Ingresa un correo', 'error');
      data.tesoreroEmail = email;
      guardarConfigLocal();
      render(); renderSelect();
      toast('Tesorero guardado');
    }
    return;
  }

  if (e.target.id === 'form-config') {
    e.preventDefault();
    const f = new FormData(e.target);
    const meta = Math.max(1, Number(f.get('meta')) || 1);
    if (totalSopas() > meta) return toast(`Ya hay ${totalSopas()} sopas vendidas`, 'error');
    data.config = {
      titulo: String(f.get('titulo')).trim() || 'Campaña de Sopas',
      beneficiario: String(f.get('beneficiario')).trim() || 'Causa solidaria',
      meta,
      precio: Math.max(0, Number(f.get('precio')) || 0),
      moneda: String(f.get('moneda')).trim() || '$'
    };
    guardarConfigLocal();
    render(); renderSelect();
    toast('Configuración guardada');
    return;
  }
});

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (b) { activeTab = b.dataset.tab; render(); }
});

$('#btn-new').addEventListener('click', () => openModal());

$('#btn-refresh').addEventListener('click', async () => {
  const icon = $('#btn-refresh i');
  icon?.classList.add('animate-spin');
  await cargarVentasDesdeAPI();
  render();
  icon?.classList.remove('animate-spin');
  toast('Datos actualizados');
});

/* ═══════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════ */
(async function init() {
  icons();
  cargarConfigLocal();
  await cargarVentasDesdeAPI();
  determinarUsuario();

  $('#loading-screen').style.display = 'none';

  if (!user) {
    const s = $('#screen-select');
    s.classList.remove('hidden');
    s.style.display = 'flex';
    renderSelect();
    return;
  }

  $('#screen-select').classList.add('hidden');
  $('#screen-app').classList.remove('hidden');
  render();

  // Auto-refresh cada 30 segundos
  setInterval(async () => {
    await cargarVentasDesdeAPI();
    render();
  }, 30000);
})();
</script>
</body>
</html>
